# 复制为 config.yaml 后按需修改
app:
  host: "0.0.0.0"
  port: 8000
  reload: true

sdk:
  base_url: "http://localhost:4000"
  api_key: "sk-1234"
  model: "claude-sonnet-4-5"
  # Claude Code 子进程额外环境（会覆盖同名变量）。直连 Anthropic 时通常需要：
  # env:
  #   ANTHROPIC_API_KEY: "sk-ant-..."
  # Vertex 模式示例（依赖本机 ADC）：
  # env:
  #   CLAUDE_CODE_USE_VERTEX: "1"
  #   ANTHROPIC_VERTEX_PROJECT_ID: "ai-model-487001"
  #   CLOUD_ML_REGION: "global"
  #   GOOGLE_APPLICATION_CREDENTIALS: "/Users/you/.config/gcloud/application_default_credentials.json"
  # 若 CLI 不在默认 PATH，可指定：
  # cli_path: "/usr/local/bin/claude"
  env: {}
  cli_path: null

agent:
  system_prompt: "你是一个专业、严谨的工程师 Agent。"

storage:
  upload_root: "uploads"
  pending_dir_name: ".pending"

api:
  return_steps: true
  max_step_preview_chars: 800
