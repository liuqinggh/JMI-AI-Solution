[project]
name = "agent-sdk-api-service"
version = "0.1.0"
description = "FastAPI wrapper around Claude Agent SDK"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "claude-agent-sdk>=0.1.49",
    "sse-starlette>=2.0",
    "pydantic>=2.0",
    "langfuse>=4.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
